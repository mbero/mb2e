<div class="brand">
  <img src="mb2e-logo.jpg" alt="mb2e — Markdown Based Blog Engine" width="220" />
  <div class="tag"><span aria-hidden="true"></span>Deployment dashboard</div>
</div>
<ul class="nav">
  <li>
    <a href="./" aria-current="page" class="item current">
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        aria-hidden="true"
      >
        <rect x="2" y="2" width="5" height="5" />
        <rect x="9" y="2" width="5" height="5" />
        <rect x="2" y="9" width="5" height="5" />
        <rect x="9" y="9" width="5" height="5" />
      </svg>
      Dashboard<span class="marker" aria-hidden="true"></span
    ></a>
  </li>
  @if (siteUrl(); as site) {
    <li>
      <a [href]="site" class="item">
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path d="M9 3h4v4M13 3 7 9M11 9v4H3V5h4" />
        </svg>
        Live site<span class="visually-hidden"> (opens the blog)</span></a
      >
    </li>
  }
</ul>
@if (sourceRepo() && targetRepo()) {
  <div class="pipeline">
    <div class="pipeline-title">Pipeline</div>
    {{ sourceRepo() }}<br /><span aria-hidden="true">↓</span> build<br />{{ targetRepo() }}
  </div>
}
<div class="user">
  <div class="who">
    <span class="avatar" aria-hidden="true">{{ (login() || '?').charAt(0).toUpperCase() }}</span>
    <span class="login">{{ login() }}</span>
  </div>
  <button type="button" class="signout" (click)="signOut.emit()">Sign out</button>
</div>

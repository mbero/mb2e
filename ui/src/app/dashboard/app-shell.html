<a class="skip" href="#content" (click)="focusContent($event)">Skip to content</a>
<header class="topbar">
  <img src="mb2e-logo.jpg" alt="mb2e" width="96" />
  <button
    #menu
    type="button"
    class="menu"
    aria-controls="sidebar"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="open() ? 'Close menu' : 'Open menu'"
    (click)="open() ? close() : open.set(true)"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="square"
      aria-hidden="true"
    >
      <path d="M3 6h18M3 12h18M3 18h18" />
    </svg>
  </button>
</header>
<div class="layout">
  <nav id="sidebar" aria-label="Main" class="sidebar" [class.is-open]="open()">
    <mb-sidebar
      [login]="login()"
      [siteUrl]="siteUrl()"
      [sourceRepo]="sourceRepo()"
      [targetRepo]="targetRepo()"
      (signOut)="signOut.emit()"
    />
  </nav>
  @if (open()) {
    <div class="scrim" (click)="close()"></div>
  }
  <main #content id="content" tabindex="-1">
    <div class="inner"><ng-content /></div>
  </main>
</div>
